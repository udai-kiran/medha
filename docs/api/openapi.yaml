        Streamable HTTP MCP endpoint (spec 2025-06-18). GET opens an SSE stream;
        POST sends MCP requests; DELETE closes the session. The standalone MCP
        server on port 3114 is the recommended entry point for MCP clients.
      operationId: mcpGet
      tags: [infra]
