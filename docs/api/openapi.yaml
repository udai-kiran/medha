          application/json:
            schema: { type: object }
      responses:
        "200":
          description: MCP response.

components:
  schemas:
    HookPayload:
      type: object
      required: [hookType, sessionId, timestamp]
      properties:
        hookType:
          type: string
          enum:
            - session_start
            - session_end
            - user_prompt
            - pre_tool_use
            - post_tool_use
            - post_tool_failure
            - subagent_end
            - notification
        sessionId:
          type: string
        project:
          type: string
        cwd:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: Hook-specific payload. Tool fields (tool_name, tool_input, tool_output) are extracted when present.

    ObserveResponse:
      type: object
      required: [compressing, compressed]
      properties:
        observationId:
          type: string
        compressing:
          type: boolean
        compressed:
          type: boolean
        deduplicated:
          type: boolean

    Memory:
      type: object
      required: [id, type, tier, title, content, strength, isLatest, createdAt, updatedAt]
      properties:
        id:
          type: string
        project:
          type: string
        type:
          type: string
          enum: [architecture, pattern, preference, bug, workflow, fact]
        tier:
          type: string
          enum: [working, episodic, semantic, procedural]
        title:
          type: string
        content:
          type: string
        concepts:
          type: array
          items: { type: string }
        files:
          type: array
          items: { type: string }
        sessionIds:
          type: array
          items: { type: string }
        sourceObservationIds:
          type: array
          items: { type: string }
        strength:
          type: number
          format: double
          description: Ebbinghaus strength (0–1). Memories below DECAY_EVICTION_THRESHOLD are evicted nightly.
        isLatest:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastRetrievedAt:
          type: string
          format: date-time

    RememberRequest:
      type: object
      required: [type, title, content]
      properties:
        project:
          type: string
        type:
          type: string
          enum: [architecture, pattern, preference, bug, workflow, fact]
        tier:
          type: string
          enum: [working, episodic, semantic, procedural]
          default: semantic
        title:
          type: string
        content:
          type: string
        concepts:
          type: array
          items: { type: string }
        files:
          type: array
          items: { type: string }
        sessionIds:
          type: array
          items: { type: string }
        strength:
          type: number
          format: double
          default: 1.0

    RememberResponse:
      type: object
      properties:
        memoryId:
          type: string
        title:
          type: string

    ForgetRequest:
      type: object
      required: [memoryId]
      properties:
        memoryId:
          type: string
        actor:
          type: string
        reason:
          type: string

    SessionSummary:
      type: object
      required: [sessionId, title, narrative, createdAt]
      properties:
        sessionId:
          type: string
        title:
          type: string
        narrative:
          type: string
        keyDecisions:
          type: array
          items: { type: string }
        filesModified:
          type: array
          items: { type: string }
        concepts:
          type: array
          items: { type: string }
        createdAt:
          type: string
          format: date-time

    RawObservation:
      type: object
      required: [id, sessionId, hookType, timestamp]
      properties:
        id:
          type: string
        sessionId:
          type: string
        project:
          type: string
        hookType:
          type: string
        timestamp:
          type: string
          format: date-time
        hasSecrets:
          type: boolean
          description: True if the privacy filter detected and redacted secrets.
        compressed:
          type: boolean
        title:
          type: string
        narrative:
          type: string
        concepts:
          type: array
          items: { type: string }
        files:
          type: array
          items: { type: string }

    SmartSearchRequest:
      type: object
      required: [query]
      properties:
        project:
          type: string
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          default: 10
        mode:
          type: string
          enum: [bm25, vector, graph, hybrid]
          default: hybrid

    SmartSearchResponse:
      type: object
      required: [mode, query, results]
      properties:
        mode:
          type: string
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SmartSearchResult"

    SmartSearchResult:
      type: object
      required: [observationId, relevance]
      properties:
        observationId:
          type: string
        type:
          type: string
        title:
          type: string
        subtitle:
          type: string
        snippet:
          type: string
        concepts:
          type: array
          items: { type: string }
        sessionId:
          type: string
        timestamp:
          type: string
          format: date-time
        relevance:
          type: number
          format: double

    PreferenceInput:
      type: object
      required: [project, preference]
      properties:
        project:
          type: string
        category:
          type: string
        preference:
          type: string
        confidence:
          type: number
          format: double
          default: 1.0
        metadata:
          type: object
          additionalProperties: true

    Preference:
      type: object
      properties:
        id:
          type: string
        project:
          type: string
        category:
          type: string
        preference:
          type: string
        confidence:
          type: number
          format: double
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    FactInput:
      type: object
      required: [project, subject, predicate, object]
      properties:
        project:
          type: string
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        confidence:
          type: number
          format: double
          default: 1.0

    Fact:
      type: object
      properties:
        id:
          type: string
        project:
          type: string
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        confidence:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [status, version, components]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentStatus"

    ComponentStatus:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: "Subsystem name (api, postgres, neo4j, queue, python, …)"
        status:
          type: string
          enum: [ok, degraded, down]
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [error, message]
      description: Standard error shape for all error responses.
      properties:
        error:
          type: string
          description: Machine-readable error code (e.g. `validation_failed`, `not_found`).
        message:
          type: string
          description: Human-readable detail.
        fallback:
          type: boolean
          description: True when a degraded result was returned instead of a hard failure.

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InternalError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Set `AGENTMEMORY_SECRET` on the server. Pass as `Authorization: Bearer <secret>`.
        Leave the env var empty to disable auth in development.
