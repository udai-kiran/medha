openapi: 3.1.0
info:
  title: agent_mem REST API
  version: 1.0.0
  description: |
    Long-term memory layer for AI coding agents — REST surface of the medha service.

    **Base path:** All versioned routes live under `/v1/agentmemory`. Infrastructure
    routes (`/health`, `/agentmemory/health`, `/metrics`) are unversioned.

    **Stability tiers:**
    - Routes without `x-stability` are **stable** — schema is fixed for the v1 lifetime.
    - Routes tagged `x-stability: experimental` may change or be removed without notice.

    **Auth:** A Bearer token (`AGENTMEMORY_SECRET`) is required on all `/v1/agentmemory/*`
    routes when the secret is non-empty. Leave it empty in development to disable auth.

servers:
  - url: http://localhost:3111
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: infra
    description: Health and metrics — no auth, no version prefix.
  - name: capture
    description: Ingestion of agent lifecycle observations.
  - name: search
    description: Hybrid memory search (BM25 + vector + graph, fused via RRF).
  - name: memory
    description: Explicit memory creation and retrieval.
  - name: sessions
    description: Session lifecycle — start, end, and summary retrieval.
  - name: observations
    description: Raw observation access and file-history queries.
  - name: context
    description: On-demand context assembly for injection into agent prompts.
  - name: preferences
    description: Agent-detected user preferences.
  - name: facts
    description: Subject–predicate–object fact triples.
  - name: profile
    description: Aggregated project profile (preferences + facts + memories).
  - name: orchestration
    description: "**Experimental.** Actions, leases, routines, signals, checkpoints, sentinels."
  - name: team
    description: "**Experimental.** Cross-agent memory sharing and audit."
  - name: conversations
    description: "**Experimental.** Short-term conversation message store."
  - name: entities
    description: "**Experimental.** Named-entity registry, enrichment, deduplication."
  - name: slots
    description: "**Experimental.** Named key-value slots and working-memory stack."
  - name: traces
    description: "**Experimental.** Multi-step agent execution traces."
  - name: patterns
    description: "**Experimental.** Recurring-pattern detection."
  - name: timeline
    description: "**Experimental.** Chronological activity feed."
  - name: export
    description: "**Experimental.** Backup/restore and snapshot management."
  - name: advanced-retrieval
    description: "**Experimental.** Facets, lessons, skills."
  - name: platform
    description: "**Experimental.** Vision embedding, mesh sync, maintenance."
  - name: diagnose
    description: "**Experimental.** Self-diagnostic and healing endpoints."
  - name: governance
    description: "**Experimental.** Privileged delete and full audit log."

paths:
  # ── Infra (unversioned) ────────────────────────────────────────────────────

  /agentmemory/health:
    get:
      summary: Service health probe
      description: |
        Returns overall and per-component status. Neo4j is optional (ADR-0003);
        when disabled, its component reports `degraded` and the overall status is
        `degraded` rather than `down`. Always returns HTTP 200 — the body carries
        the degradation signal.
      operationId: getHealth
      tags: [infra]
      security: []
      responses:
        "200":
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                version: "1.0.0"
                components:
                  - name: api
                    status: ok
                  - name: postgres
                    status: ok
                  - name: neo4j
                    status: degraded
                    message: "disabled (NEO4J_ENABLED=false)"

  # ── Capture ────────────────────────────────────────────────────────────────

  /v1/agentmemory/observe:
    post:
      summary: Capture an agent lifecycle observation
      description: |
        Ingests a single hook payload from an agent lifecycle event. Processing order:

        1. Privacy filter — strips `<private>…</private>` blocks and redacts secrets before any DB write.
        2. Deduplication — 5-minute rolling SHA-256 window per session; duplicates return 202.
        3. Persistence — stores a `RawObservation` and enqueues async compression.

        When `hookType` is `session_end`, the handler routes to the consolidation
        pipeline instead and returns 202 without creating an observation row.
      operationId: postObserve
      tags: [capture]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookPayload"
            example:
              hookType: post_tool_use
              sessionId: sess-abc123
              project: my-project
              timestamp: "2026-06-02T10:30:00Z"
              data:
                tool_name: read
                tool_input: {file_path: src/auth.ts}
                tool_output: "export function validateToken() {}"
      responses:
        "201":
          description: Observation accepted and compression queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveResponse"
        "202":
          description: Duplicate observation (within dedup window) or `session_end` consolidation triggered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Search ─────────────────────────────────────────────────────────────────

  /v1/agentmemory/smart-search:
    post:
      summary: Hybrid memory search
      description: |
        Searches compressed observations using BM25 (keyword), vector (cosine
        similarity), and optionally graph (entity BFS), then fuses rankings with
        Reciprocal Rank Fusion (k=60). A per-session diversity cap of 3 is applied.
        Use `mode` to restrict to a single engine for debugging.
      operationId: postSmartSearch
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartSearchRequest"
            example:
              project: my-project
              query: validate token
              mode: hybrid
              limit: 10
      responses:
        "200":
          description: Ranked search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agentmemory/search:
    post:
      summary: Alias for /v1/agentmemory/smart-search
      operationId: postSearch
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartSearchRequest"
      responses:
        "200":
          description: Ranked search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Memory ─────────────────────────────────────────────────────────────────

  /v1/agentmemory/remember:
    post:
      summary: Explicitly create a memory
      operationId: postRemember
      tags: [memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RememberRequest"
      responses:
        "201":
          description: Memory created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RememberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agentmemory/forget:
    post:
      summary: Delete a memory by ID
      operationId: postForget
      tags: [memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetRequest"
      responses:
        "204":
          description: Memory deleted (or was already absent).
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agentmemory/memories:
    get:
      summary: List memories for a project
      operationId: listMemories
      tags: [memory]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            type: string
            enum: [architecture, pattern, preference, bug, workflow, fact]
        - name: tier
          in: query
          schema:
            type: string
            enum: [working, episodic, semantic, procedural]
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Paginated memory list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Memory"
                  total:
                    type: integer

  /v1/agentmemory/memory/{id}:
    get:
      summary: Get a single memory by ID
      operationId: getMemory
      tags: [memory]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Memory record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Sessions ───────────────────────────────────────────────────────────────

  /v1/agentmemory/session/start:
    post:
      summary: Start a new agent session
      operationId: postSessionStart
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                project:
                  type: string
                cwd:
                  type: string
      responses:
        "201":
          description: Session created. When context injection is enabled, `injectedContext` is populated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  injectedContext:
                    type: object
                    description: Memory context injected into the agent at session start.

  /v1/agentmemory/session/end:
    post:
      summary: End a session and trigger consolidation
      operationId: postSessionEnd
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                summaryHint:
                  type: string
                  description: Optional hint passed to the LLM summarizer.
      responses:
        "202":
          description: Consolidation pipeline triggered asynchronously.

  /v1/agentmemory/session/{id}:
    get:
      summary: Get a session summary
      operationId: getSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agentmemory/sessions:
    get:
      summary: List sessions for a project
      operationId: listSessions
      tags: [sessions]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Session list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"

  # ── Observations ───────────────────────────────────────────────────────────

  /v1/agentmemory/observations:
    get:
      summary: List raw observations for a session
      operationId: listObservations
      tags: [observations]
      parameters:
        - name: session
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Observation list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  observations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RawObservation"

  /v1/agentmemory/observation/{id}:
    get:
      summary: Get a single raw observation
      operationId: getObservation
      tags: [observations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Observation record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawObservation"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agentmemory/file-history:
    get:
      summary: Observations that touched a specific file
      operationId: getFileHistory
      tags: [observations]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: file
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Observations referencing the file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  observations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RawObservation"

  # ── Context ────────────────────────────────────────────────────────────────

  /v1/agentmemory/context:
    post:
      summary: Assemble memory context for prompt injection
      description: |
        Runs a hybrid search and assembles the top results into a context block
        ready for injection into an agent system prompt.
      operationId: postContext
      tags: [context]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, query]
              properties:
                project:
                  type: string
                query:
                  type: string
                limit:
                  type: integer
                  default: 10
                sessionId:
                  type: string
      responses:
        "200":
          description: Assembled context block.
          content:
            application/json:
              schema:
                type: object
                properties:
                  context:
                    type: string
                  sources:
                    type: integer
                    description: Number of memory records included.

  # ── Preferences ────────────────────────────────────────────────────────────

  /v1/agentmemory/preferences:
    post:
      summary: Record a user preference
      operationId: addPreference
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferenceInput"
      responses:
        "201":
          description: Preference stored.
    get:
      summary: Search preferences for a project
      operationId: searchPreferences
      tags: [preferences]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: "#/components/schemas/Preference"

  /v1/agentmemory/preference/{id}:
    delete:
      summary: Delete a preference
      operationId: deletePreference
      tags: [preferences]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted.

  # ── Facts ──────────────────────────────────────────────────────────────────

  /v1/agentmemory/facts:
    post:
      summary: Record a subject–predicate–object fact
      operationId: addFact
      tags: [facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactInput"
      responses:
        "201":
          description: Fact stored.
    get:
      summary: Search facts for a project
      operationId: searchFacts
      tags: [facts]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: subject
          in: query
          schema: { type: string }
        - name: predicate
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching facts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Fact"

  # ── Profile ────────────────────────────────────────────────────────────────

  /v1/agentmemory/profile:
    get:
      summary: Aggregated project profile
      description: Returns recent preferences, facts, and top memories for a project.
      operationId: getProfile
      tags: [profile]
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Project profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: string
                  preferences:
                    type: array
                    items:
                      $ref: "#/components/schemas/Preference"
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Fact"
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Memory"

  # ── Orchestration (experimental) ───────────────────────────────────────────

  /v1/agentmemory/actions:
    get:
      summary: List actions
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Action list.
    post:
      summary: Create an action
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Action created.

  /v1/agentmemory/actions/{id}:
    get:
      summary: Get an action
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Action record.
    patch:
      summary: Update an action
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: project
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated action.

  /v1/agentmemory/frontier:
    get:
      summary: Get the next actionable frontier item
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Frontier action or empty.

  /v1/agentmemory/next:
    get:
      summary: Get the next recommended action
      x-stability: experimental
      tags: [orchestration]
      responses:
        "200":
          description: Next action.

  /v1/agentmemory/leases/{id}/acquire:
    post:
      summary: Acquire a lease on an action
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Lease acquired.
        "409":
          description: Already leased.

  /v1/agentmemory/leases/{id}/release:
    post:
      summary: Release a lease
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: Released.

  /v1/agentmemory/routines:
    get:
      summary: List routines
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Routine list.
    post:
      summary: Upsert a routine
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Routine created or updated.

  /v1/agentmemory/signals:
    post:
      summary: Send a signal to an agent
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Signal sent.
    get:
      summary: List inbox signals
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: to
          in: query
          schema: { type: string }
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Signal inbox.

  /v1/agentmemory/checkpoints:
    post:
      summary: Create a checkpoint
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Checkpoint created.

  /v1/agentmemory/checkpoints/{id}/satisfy:
    post:
      summary: Satisfy a checkpoint
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Checkpoint satisfied.

  /v1/agentmemory/sentinels:
    post:
      summary: Create a sentinel condition
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Sentinel created.

  /v1/agentmemory/sentinels/{id}/trigger:
    post:
      summary: Manually trigger a sentinel
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Triggered.

  /v1/agentmemory/sketches:
    post:
      summary: Create a sketch (draft action)
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Sketch created.

  /v1/agentmemory/sketches/{id}/promote:
    post:
      summary: Promote a sketch to a full action
      x-stability: experimental
      tags: [orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Promoted action.

  /v1/agentmemory/actions/crystallize:
    post:
      summary: Crystallize completed actions into memories
      x-stability: experimental
      tags: [orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Crystallized.

  # ── Team (experimental) ────────────────────────────────────────────────────

  /v1/agentmemory/team/share:
    post:
      summary: Share a memory with teammates
      x-stability: experimental
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Shared.

  /v1/agentmemory/team/feed:
    get:
      summary: Get the team memory feed
      x-stability: experimental
      tags: [team]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Shared memory feed.

  /v1/agentmemory/team/revoke:
    post:
      summary: Revoke a shared memory
      x-stability: experimental
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: Revoked.

  /v1/agentmemory/audit:
    get:
      summary: Audit log for the project
      x-stability: experimental
      tags: [team]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Audit entries.

  # ── Conversations (experimental) ───────────────────────────────────────────

